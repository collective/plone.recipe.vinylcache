[tox]
# If you add a Python or Plone version here, remember to update the
# gh-actions yaml file too.
envlist =
    lint
    py{38,39,310,311}-plone{60,61,62}

[testenv]
usedevelop = false
skip_install = true
deps =
    plone60: -r https://dist.plone.org/release/6.0-latest/requirements.txt
    plone61: -r https://dist.plone.org/release/6.1-latest/requirements.txt
    plone62: -r https://dist.plone.org/release/6.2-latest/requirements.txt
commands_pre =
    {envbindir}/buildout -nc {toxinidir}/tests.cfg buildout:directory={envdir} buildout:develop={toxinidir}
commands =
    {envbindir}/test {posargs:-cv}

[testenv:lint]
allowlist_externals = docker
deps =
commands_pre =
commands =
    docker run --rm -v "{toxinidir}":/github/workspace plone/code-quality:latest check
