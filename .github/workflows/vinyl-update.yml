name: vinyl-update

# Daily check for new Vinyl Cache releases. Opens one PR for the latest
# patch release of the current line and one draft PR for a newer release
# line (which needs manual review, see the PR body).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [patch, minor]
    name: ${{ matrix.kind }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for a new Vinyl Cache release
        id: check
        run: python3 .github/scripts/vinyl_update.py ${{ matrix.kind }}

      - name: Open the pull request
        if: steps.check.outputs.version
        env:
          BRANCH: ${{ steps.check.outputs.branch }}
          TITLE: ${{ steps.check.outputs.title }}
          KIND: ${{ matrix.kind }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push origin "$BRANCH"
          draft=""
          if [ "$KIND" = "minor" ]; then draft="--draft"; fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md $draft
          # PRs opened with GITHUB_TOKEN do not trigger pull_request
          # workflows; run the tests explicitly on the new branch.
          gh workflow run tests.yml --ref "$BRANCH"
          # Close the PRs for older releases of the same kind.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"vinyl-update/$KIND-\")) | select(.headRefName != \"$BRANCH\") | .number" \
          | while read -r number; do
              gh pr close "$number" --delete-branch --comment "Superseded by the update to $VERSION."
            done
