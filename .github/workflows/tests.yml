# Inspired by:
# https://github.com/zopefoundation/meta/tree/master/config/pure-python
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        # [Python version, tox env]
        # py3.9 dropped. py3.12/py3.13 are combined with plone62 only, to
        # cover the latest Python releases against the latest Plone line
        # without exploding the matrix.
        - ["3.10",   "py310-plone60"]
        - ["3.10",   "py310-plone61"]
        - ["3.10",   "py310-plone62"]
        - ["3.11",   "py311-plone60"]
        - ["3.11",   "py311-plone61"]
        - ["3.11",   "py311-plone62"]
        - ["3.12",   "py312-plone62"]
        - ["3.13",   "py313-plone62"]
    name: ${{ matrix.config[1] }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.config[0] }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config[0] }}
      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.config[0] }}-${{ hashFiles('setup.*', 'tox.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.config[0] }}-
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
          # Vinyl Cache (Varnish) >=7.0 requires PCRE2, not the old PCRE1
          # (libpcre3) headers the previous (Varnish 6.0-targeting) recipe
          # build depended on. libedit-dev matches the upstream
          # plone.recipe.varnish build dependency list as of 6.0.18.
          sudo apt-get install libxml2-dev libxslt-dev python3-docutils libpcre2-dev pkg-config graphviz libedit-dev
      - name: Test
        run: tox -e ${{ matrix.config[1] }}
