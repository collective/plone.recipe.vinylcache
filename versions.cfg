[versions]
# Build
setuptools =
zc.buildout =

# Helper
zest.releaser = >= 6.2

# Test
interlude = 1.3.1
# zc.recipe.egg 4.0.0 requires zc.buildout>=5.0.0, which conflicts with
# Plone 6.1's pinned zc.buildout==4.2.0. Pin to 3.0.0 (requires only
# zc.buildout>=4.0.0), which works fine across the 6.0/6.1/6.2 test matrix.
zc.recipe.egg = 3.0.0
# zc.recipe.testrunner >=4.0 dropped the namespace_packages.txt metadata
# shim that pkg_resources (still used internally by zc.buildout) relies on
# to merge a native-PEP-420-only package into a `zc` namespace that is
# otherwise legacy-declared (as it is here, because of the zc.recipe.egg
# pin above): with 4.0+, buildout's own entry-point loader fails with
# "ModuleNotFoundError: No module named 'zc.recipe.testrunner'" even
# though the exact same package installs and imports fine via plain pip.
# Reproduced locally with a minimal buildout run against both the
# 4.1.4/setuptools-75.8.2 (Plone 6.0/6.1-like) and 5.2.0/setuptools-81
# (Plone 6.2-like) combinations. Pin to 3.2, the last release that still
# ships that metadata shim, confirmed to work in both.
zc.recipe.testrunner = 3.2
