[versions]
# Build
setuptools =
zc.buildout =

# Helper
zest.releaser = >= 6.2

# Test
interlude = 1.3.1
# zc.recipe.egg 4.0.0 requires zc.buildout>=5.0.0, which conflicts with
# Plone 6.1's pinned zc.buildout==4.2.0. Pin to 3.0.0 (requires only
# zc.buildout>=4.0.0), which works fine across the 6.0/6.1/6.2 test matrix.
zc.recipe.egg = 3.0.0
# Without an explicit pin, buildout's resolver picked zc.recipe.testrunner
# 4.0 in some environments, which fails to import
# ("ModuleNotFoundError: No module named 'zc.recipe.testrunner'") -- pin to
# the known-good 4.2.post1 release used successfully elsewhere in CI.
zc.recipe.testrunner = 4.2.post1
